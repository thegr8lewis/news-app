services:
  - type: web
    name: news-app-backend
    env: python
    buildCommand: "cd newsbackend && pip install -r requirements.txt"
    startCommand: "cd newsbackend && python manage.py collectstatic --noinput && python manage.py migrate && gunicorn newsbackend.wsgi:application"
    plan: free
    healthCheckPath: /api/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-app-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DEBUG
        value: False

  - type: static
    name: news-app-frontend
    buildCommand: "cd newsfrontend && chmod +x build.sh && ./build.sh"
    staticPublishPath: newsfrontend/dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: https://news-app-backend-4cwg.onrender.com