services:
  - type: web
    name: news-app-backend
    env: python
    buildCommand: "cd newsbackend && pip install -r requirements.txt"
    startCommand: "cd newsbackend && python manage.py collectstatic --noinput && python manage.py migrate && gunicorn newsbackend.wsgi:application"
    plan: free
    healthCheckPath: /api/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-app-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DEBUG
        value: False